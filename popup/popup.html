<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Vectorizer Auto Click</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>Vectorizer Auto Click</h1>
  </header>

  <label class="row main">
    <span>Bật tự động</span>
    <input type="checkbox" id="enabled">
  </label>

  <fieldset id="opts">
    <label class="row">
      <span>Tự bấm <b>OK</b> ở bảng Pre-Crop</span>
      <input type="checkbox" id="autoPrecrop">
    </label>
    <label class="row">
      <span>Tự bấm <b>DOWNLOAD</b> khi có kết quả</span>
      <input type="checkbox" id="autoDownload">
    </label>
    <label class="row">
      <span>Tải xong tự về trang chính để kéo ảnh tiếp</span>
      <input type="checkbox" id="autoReturn">
    </label>
    <label class="row">
      <span>Hiện thông báo nhỏ trên trang</span>
      <input type="checkbox" id="showToast">
    </label>
  </fieldset>

  <section class="stats">
    <div><span id="today">0</span> file hôm nay · <span id="total">0</span> file tổng</div>
    <div class="last" id="last"></div>
  </section>

  <button id="open">Mở Vectorizer.AI</button>
  <p class="hint">Chỉ cần kéo ảnh vào trang Vectorizer.AI, phần còn lại extension tự làm.</p>

  <script src="../src/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
