<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Auto Click</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>Auto Click</h1>
  </header>

  <label class="row main">
    <span>Bật tự động</span>
    <input type="checkbox" id="enabled">
  </label>

  <fieldset id="opts">
    <label class="row">
      <span>Tự bấm <b>OK</b> ở bảng Pre-Crop</span>
      <input type="checkbox" id="autoPrecrop">
    </label>
    <label class="row">
      <span>Tự bấm <b>DOWNLOAD</b> khi có kết quả</span>
      <input type="checkbox" id="autoDownload">
    </label>
  </fieldset>

  <div class="status" id="status">Đang kiểm tra trang…</div>

  <section class="stats">
    <div><span id="today">0</span> file hôm nay · <span id="total">0</span> file tổng</div>
    <div class="last" id="last"></div>
  </section>

  <p class="hint">Chỉ cần kéo ảnh vào, phần còn lại tự làm. Bấm CANCEL hoặc Esc để dừng.</p>
  <button id="debug" class="link" hidden>Sao chép thông tin lỗi</button>

  <script src="../src/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
