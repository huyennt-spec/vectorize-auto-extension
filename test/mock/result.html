<!doctype html>
<html><head><meta charset="utf-8"><title>Vectorizer.AI Result (mock)</title>
<style>
  body{font-family:sans-serif;margin:0}
  .toolbar{display:flex;gap:8px;padding:6px;border-bottom:1px solid #ddd}
  .toolbar .icon{width:28px;height:28px;background:#3b82f6;display:inline-block}
  #canvas{height:300px;margin:20px;background:#fafafa;position:relative}
  #progress{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8)}
  #dl{position:fixed;left:40%;bottom:30px;padding:14px 34px;border-radius:30px;background:#3b82f6;color:#fff;
      text-transform:uppercase;text-decoration:none;font-weight:bold}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4)}
  #modal{position:fixed;left:30%;top:60px;width:280px;background:#fff;padding:16px;border-radius:8px}
  #modal .bar{height:10px;background:#3b82f6;margin:4px 0 12px}
  #modal button{background:#c62828;color:#fff;border:0;border-radius:20px;padding:8px 20px;text-transform:uppercase}
</style></head>
<body>
  <div class="toolbar">
    <a class="icon" href="#" title="Download"></a>
    <a href="#">Download Options</a>
    <a href="/" id="close">X</a>
  </div>
  <div id="canvas"><span>Vectorizer.AI Result</span><div id="progress"><span id="ptext">Vectorizing...</span></div></div>
  <div id="busy" hidden>
    <div id="backdrop"></div>
    <div id="modal">Upload<div class="bar"></div>Process<div class="bar" style="width:20%"></div>Fetch<div class="bar" style="width:0"></div>
      <button id="cancel">Cancel</button></div>
  </div>
  <a id="dl" href="#"><i class="material-icons">file_download</i> <span>Download</span></a>
<script>
  const dl = document.getElementById('dl');
  const id = location.pathname.split('/').pop();
  // Đang xử lý: bảng Upload / Process / Fetch và nền mờ che nút DOWNLOAD (như web thật).
  let timer = 0;
  function process(newId, ms) {
    document.getElementById('busy').hidden = false;
    document.getElementById('progress').style.display = 'flex';
    timer = setTimeout(() => {
      document.getElementById('busy').hidden = true;
      document.getElementById('progress').style.display = 'none';
      dl.href = '/images/' + newId + '/download';
    }, ms);
  }
  // Bấm CANCEL: đóng bảng; nút DOWNLOAD vẫn bấm được (trường hợp xấu nhất).
  document.getElementById('cancel').addEventListener('click', () => {
    clearTimeout(timer);
    document.getElementById('busy').hidden = true;
    dl.href = '/images/' + id + '/download';
  });
  process(id, 2000);
  // Lớp trong suốt phủ cả trang (không phải bảng nào) → extension vẫn phải bấm được.
  if (location.search.includes('overlay')) {
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;z-index:5';
    document.body.appendChild(o);
  }
  // Trang khó tính: không nhận cú bấm do script gửi (chỉ nhận chuột thật).
  if (location.search.includes('strict')) {
    dl.addEventListener('click', (e) => { if (!e.isTrusted) e.preventDefault(); });
  }
  // Web tự xử lý ảnh mới mà không qua kéo/thả (để thử nhận việc từ bảng tiến trình).
  window.__reprocess = (name) => process(Date.now() + '-' + encodeURIComponent(name), 2000);
  // Thả ảnh mới ngay trên trang kết quả: xử lý tại chỗ, không chuyển trang.
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    process(Date.now() + '-' + encodeURIComponent(e.dataTransfer.files[0].name), 2000);
  });
</script>
</body></html>
