<!doctype html>
<html><head><meta charset="utf-8"><title>Download - Vectorizer.AI (mock)</title>
<style>
  body{font-family:sans-serif;margin:0}
  header{padding:10px;border-bottom:1px solid #ddd}
  header a{margin-right:16px}
  .card{margin:20px;padding:20px;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.15);position:relative}
  h1{font-size:40px;margin:0}
  .btn{display:inline-block;padding:16px 40px;border-radius:12px;background:#3b82f6;color:#fff;text-decoration:none;font-size:20px}
  #main{position:absolute;right:20px;top:20px}
  .formats{display:flex;gap:10px}
  .fmt{border:1px solid #ccc;border-radius:8px;padding:10px 20px;text-align:center;cursor:pointer}
  .fmt.sel{border-color:#3b82f6;background:#eef4ff}
  /* Chế độ 'fade': thẻ hiện dần bằng hiệu ứng (không chạy khi cửa sổ ẩn), nút khoá tới khi hiệu ứng xong */
  .card.fade{opacity:0;animation:fadein .6s .3s forwards}
  .card.fade #main{pointer-events:none}
  @keyframes fadein{to{opacity:1}}
</style></head>
<body>
  <header><a href="/">Vectorizer.AI</a><a href="/api">Developers</a><a href="/pricing">Pricing</a></header>
  <div class="card">
    <h1>Download</h1>
    <p id="name"></p>
    <a id="main" class="btn" href="#"><i class="material-icons">file_download</i> Download</a>
    <h3>File format</h3>
    <div class="formats">
      <div class="fmt sel"><b>SVG</b><br><small>Web &amp; apps</small></div>
      <div class="fmt"><b>PDF</b><br><small>Documents</small></div>
      <div class="fmt"><b>PNG</b><br><small>Clean bitmap</small></div>
    </div>
    <h3>Optimize for</h3>
    <div class="formats"><div class="fmt sel">General use (default)</div><div class="fmt">Easy editing</div></div>
    <p><a class="btn" id="bottom" href="#" style="font-size:14px;padding:8px 16px">Download</a></p>
  </div>
  <div id="pre" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.4)">
    <div style="background:#fff;margin:60px auto;width:400px;padding:20px">
      <h2>Pre-Crop</h2><p>Your image size exceeds the size limit.</p>
      <button id="cancel">Cancel</button> <button id="ok">OK</button>
    </div>
  </div>
<script>
  // Chế độ thử (test đặt trong localStorage): '' | late | defer | visonly | prep | query | churn | fade
  const mode = localStorage.getItem('mockMode') || '';
  const id = new URLSearchParams(location.search).get('img') || location.pathname.split('/')[2];
  document.getElementById('name').textContent = decodeURIComponent(id.split('-').slice(1).join('-'));
  const fileUrl = '/download/' + id;
  window.__mainClicks = 0;
  document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('#main')) window.__mainClicks++; }, true);
  if (mode === 'prep') {
    // Bấm xong trang "chuẩn bị file" 8 giây rồi mới tải (nút vẫn ghi Download, không bị khoá).
    for (const a of document.querySelectorAll('a.btn')) {
      a.addEventListener('click', (e) => { e.preventDefault(); setTimeout(() => { location.href = fileUrl; }, 8000); });
    }
  } else if (mode === 'late' || mode === 'defer' || mode === 'visonly') {
    // Như web thật: nút là <a href="#">, script của trang gắn việc cho nút sau; bấm sớm thì hụt (chỉ thêm '#').
    window.__wire = () => {
      for (const a of document.querySelectorAll('a.btn')) {
        a.addEventListener('click', (e) => { e.preventDefault(); location.href = fileUrl; });
      }
    };
    if (mode === 'late') addEventListener('load', () => setTimeout(window.__wire, 2500));
    // 'visonly': trang chỉ gắn việc cho nút khi cửa sổ đang hiện.
    if (mode === 'visonly') {
      if (document.visibilityState === 'visible') window.__wire();
      else {
        document.addEventListener('visibilitychange', function onVis() {
          if (document.visibilityState !== 'visible') return;
          document.removeEventListener('visibilitychange', onVis);
          window.__wire();
        });
      }
    }
    // 'defer': file /assets/dl-wire.js (tải chậm) gọi window.__wire()
  } else {
    for (const a of document.querySelectorAll('a.btn')) a.href = fileUrl;
  }
  if (mode === 'churn') { // Trang liên tục vẽ lại nút trong 3 giây đầu
    const end = Date.now() + 3000;
    const t = setInterval(() => {
      const m = document.getElementById('main');
      m.replaceWith(m.cloneNode(true));
      if (Date.now() > end) clearInterval(t);
    }, 4);
  }
  if (mode === 'fade') {
    const card = document.querySelector('.card');
    card.classList.add('fade');
    card.addEventListener('animationend', () => card.classList.remove('fade'));
  }
  // Kéo ảnh mới vào trang này: web tự nhận và xử lý ảnh mới. Ảnh lớn: bảng Pre-Crop, bấm OK
  // xong web mất 2,5 giây thu nhỏ ảnh, trong lúc đó nút Download của ảnh cũ vẫn bấm được.
  let next = null;
  const go = () => {
    sessionStorage.setItem('mockFresh', '1');
    location.href = '/images/' + Date.now() + '-' + encodeURIComponent(next);
  };
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    next = e.dataTransfer.files[0].name;
    if (/big/.test(next)) {
      // Như web thật: bảng hiện ra nhưng phải tải xong ảnh lớn thì OK mới bấm được.
      const ok = document.getElementById('ok');
      ok.disabled = true;
      document.getElementById('pre').hidden = false;
      setTimeout(() => { ok.disabled = false; }, 1500);
    } else go();
  });
  document.getElementById('ok').addEventListener('click', () => {
    document.getElementById('pre').hidden = true;
    setTimeout(go, 2500);
  });
</script>
</body></html>
